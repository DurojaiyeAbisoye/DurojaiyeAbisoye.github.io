<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>POST_TITLE — Durojaiye Abisoye</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%230a0a0f'/><text y='.9em' font-size='60' x='50%' dominant-baseline='middle' text-anchor='middle' fill='%239d4edd' font-family='serif' font-weight='700'>D</text></svg>"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css"/>
  <style>
    :root {
      --black: #06060a;
      --surface: #0e0e16;
      --surface2: #14141f;
      --border: #1e1e2e;
      --purple: #9d4edd;
      --purple-light: #bb86fc;
      --purple-dim: #6a1fa8;
      --purple-glow: rgba(157, 78, 221, 0.15);
      --text: #e8e6f0;
      --text-muted: #7a7891;
      --text-dim: #4a4862;
      --white: #f4f2ff;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--black);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      line-height: 1.7;
      cursor: none;
    }

    /* CURSOR */
    .cursor { position: fixed; width: 12px; height: 12px; background: var(--purple); border-radius: 50%; pointer-events: none; z-index: 9999; transform: translate(-50%,-50%); mix-blend-mode: screen; }
    .cursor-ring { position: fixed; width: 36px; height: 36px; border: 1px solid rgba(157,78,221,0.4); border-radius: 50%; pointer-events: none; z-index: 9998; transform: translate(-50%,-50%); transition: transform 0.15s ease-out; }

    /* NAV */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 1.25rem 3rem;
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(6,6,10,0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .nav-logo { font-family: 'DM Serif Display', serif; font-size: 1.3rem; color: var(--white); text-decoration: none; }
    .nav-logo span { color: var(--purple-light); }
    .nav-back { font-family: 'DM Mono', monospace; font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); text-decoration: none; transition: color 0.2s; display: flex; align-items: center; gap: 0.5rem; }
    .nav-back:hover { color: var(--purple-light); }

    /* POST LAYOUT */
    .post-wrapper {
      max-width: 720px;
      margin: 0 auto;
      padding: 8rem 2rem 6rem;
    }

    /* POST HEADER */
    .post-eyebrow {
      display: flex; align-items: center; gap: 1.5rem;
      margin-bottom: 2rem;
    }
    .post-date {
      font-family: 'DM Mono', monospace;
      font-size: 0.68rem; letter-spacing: 0.1em;
      color: var(--text-dim);
    }
    .post-tags { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .post-tag {
      padding: 0.2rem 0.6rem;
      background: var(--purple-glow);
      border: 1px solid rgba(157,78,221,0.2);
      font-family: 'DM Mono', monospace;
      font-size: 0.6rem; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--purple-light);
    }
    .post-title {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(2rem, 5vw, 3.2rem);
      line-height: 1.1; letter-spacing: -0.02em;
      color: var(--white);
      margin-bottom: 1.5rem;
    }
    .post-summary {
      font-size: 1.05rem;
      color: var(--text-muted);
      line-height: 1.8;
      margin-bottom: 2rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--border);
    }
    .post-repo-link {
      display: inline-flex; align-items: center; gap: 0.5rem;
      font-family: 'DM Mono', monospace; font-size: 0.72rem;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--text-muted); text-decoration: none;
      border: 1px solid var(--border);
      padding: 0.6rem 1.1rem;
      transition: color 0.2s, border-color 0.2s;
      margin-bottom: 3rem;
      display: inline-flex;
    }
    .post-repo-link:hover { color: var(--purple-light); border-color: var(--purple-dim); }

    /* POST CONTENT */
    .post-content { font-size: 1rem; line-height: 1.9; color: var(--text-muted); }
    .post-content h1, .post-content h2, .post-content h3 {
      font-family: 'DM Serif Display', serif;
      color: var(--white);
      margin: 2.5rem 0 1rem;
      letter-spacing: -0.01em;
    }
    .post-content h2 { font-size: 1.7rem; }
    .post-content h3 { font-size: 1.25rem; }
    .post-content p { margin-bottom: 1.4rem; }
    .post-content strong { color: var(--text); font-weight: 500; }
    .post-content em { color: var(--text); font-style: italic; }
    .post-content a { color: var(--purple-light); text-decoration: none; border-bottom: 1px solid rgba(187,134,252,0.3); transition: border-color 0.2s; }
    .post-content a:hover { border-color: var(--purple-light); }
    .post-content ul, .post-content ol { padding-left: 1.5rem; margin-bottom: 1.4rem; }
    .post-content li { margin-bottom: 0.4rem; }
    .post-content blockquote {
      border-left: 3px solid var(--purple-dim);
      padding: 1rem 1.5rem;
      margin: 2rem 0;
      background: var(--surface);
      color: var(--text-muted);
      font-style: italic;
    }
    .post-content hr { border: none; border-top: 1px solid var(--border); margin: 2.5rem 0; }
    .post-content img { max-width: 100%; border: 1px solid var(--border); margin: 2rem 0; }

    /* CODE */
    .post-content pre {
      background: var(--surface) !important;
      border: 1px solid var(--border);
      border-radius: 0;
      padding: 1.5rem !important;
      margin: 1.75rem 0;
      overflow-x: auto;
      position: relative;
    }
    .post-content pre .copy-btn {
      position: absolute;
      top: 0.75rem; right: 0.75rem;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-family: 'DM Mono', monospace;
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.3rem 0.6rem;
      cursor: none;
      transition: color 0.2s, border-color 0.2s;
    }
    .post-content pre .copy-btn:hover { color: var(--purple-light); border-color: var(--purple-dim); }
    .post-content code:not(pre code) {
      font-family: 'DM Mono', monospace;
      font-size: 0.85em;
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 0.15em 0.45em;
      color: var(--purple-light);
    }

    /* FOOTER NAV */
    .post-footer {
      margin-top: 5rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .post-footer a {
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    .post-footer a:hover { color: var(--purple-light); }

    @media (max-width: 768px) {
      nav { padding: 1rem 1.5rem; }
      .post-wrapper { padding: 7rem 1.5rem 4rem; }
    }
  </style>
</head>
<body>

  <div class="cursor" id="cursor"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <nav>
    <a href="../index.html" class="nav-logo">D<span>.</span>A</a>

  </nav>

  <div class="post-wrapper">
    <div class="post-eyebrow">
      <span class="post-date">POST_DATE</span>
      <div class="post-tags">
        <!-- REPLACE with your tags: <span class="post-tag">theory</span> -->
        POST_TAGS
      </div>

    <h1 class="post-title">POST_TITLE</h1>
    <p class="post-summary">POST_SUMMARY</p>

    <!-- REMOVE this block if post has no repo -->

    <div class="post-content" id="postContent">

    <div class="post-footer">
      <a href="../index.html#blog">← All posts</a>
      <a href="mailto:abisoyeodurojaiye@gmail.com">Discuss via email →</a>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-sql.min.js"></script>
  <script>
    // Cursor
    const cursor = document.getElementById('cursor');
    const ring = document.getElementById('cursorRing');
    let mx=0,my=0,rx=0,ry=0;
    document.addEventListener('mousemove', e=>{mx=e.clientX;my=e.clientY;});
    (function a(){cursor.style.left=mx+'px';cursor.style.top=my+'px';rx+=(mx-rx)*.12;ry+=(my-ry)*.12;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(a);})();

    // Add copy buttons to all code blocks
    document.querySelectorAll('pre').forEach(pre => {
      const btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.textContent = 'Copy';
      btn.addEventListener('click', () => {
        navigator.clipboard.writeText(pre.querySelector('code').innerText);
        btn.textContent = 'Copied';
        setTimeout(() => btn.textContent = 'Copy', 2000);
      });
      pre.style.position = 'relative';
      pre.appendChild(btn);
    });
  </script>
</body>
